<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pairing Board — Live Chess-Results Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --baize: #0f2e24;
    --baize-deep: #081d17;
    --baize-card: #153b2f;
    --ivory: #f5f0e6;
    --walnut: #1e1509;
    --walnut-2: #2b1f0f;
    --amber: #e6b33c;
    --amber-deep: #c49125;
    --amber-light: #fce6a6;
    --sand: #c7beab;
    --line: rgba(245, 240, 230, 0.12);
    --line-active: rgba(230, 179, 60, 0.4);
    --font-display: 'Anton', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-data: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--baize);
    background-image: radial-gradient(1200px 600px at 50% -200px, rgba(230, 179, 60, 0.09), transparent 70%);
    color: var(--ivory);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  a { color: var(--amber); text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  header { padding: 22px 0 14px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--sand);
  }
  .brand .dot {
    width: 8px; height: 8px; background: var(--amber); border-radius: 50%;
    box-shadow: 0 0 8px var(--amber);
  }
  .live-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em;
    border: 1px solid var(--line); padding: 3px 9px; border-radius: 20px;
    color: var(--sand); background: rgba(8, 29, 23, 0.6);
  }
  .live-status.active { border-color: var(--amber); color: var(--amber-light); }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #4cd964;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.7); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(76, 217, 100, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(32px, 8.5vw, 44px);
    font-weight: 400; letter-spacing: 0.02em; line-height: 1.05;
    margin: 6px 0 8px; text-transform: uppercase;
  }
  h1 em { font-style: normal; color: var(--amber); }

  .event-meta {
    font-size: 14px; color: var(--sand); line-height: 1.4;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .event-meta strong { color: var(--ivory); font-weight: 600; }
  .meta-tag {
    font-family: var(--font-data); font-size: 11px;
    background: rgba(245, 240, 230, 0.08); padding: 2px 7px; border-radius: 3px;
  }

  /* Tournament Selector Box */
  .tnr-box {
    background: var(--baize-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px; margin: 16px 0;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  .tnr-row { display: flex; gap: 8px; }
  .tnr-input-wrap { flex: 1; position: relative; }
  .tnr-input-wrap input {
    width: 100%; background: rgba(245, 240, 230, 0.05); border: 1px solid var(--line);
    color: var(--ivory); font: 14px var(--font-data); padding: 10px 12px;
    border-radius: 4px; transition: border-color 0.2s;
  }
  .tnr-input-wrap input:focus { border-color: var(--amber); outline: none; }
  .btn-load {
    background: var(--amber); color: var(--baize-deep); font-weight: 600;
    font-size: 13.5px; padding: 0 16px; border-radius: 4px; white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-load:hover { background: var(--amber-light); }
  .btn-load:active { transform: scale(0.98); }

  .tnr-hints {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11.5px; color: var(--sand); margin-top: 8px;
    font-family: var(--font-data);
  }
  .auto-refresh-select {
    background: transparent; border: 1px solid var(--line); color: var(--sand);
    font: 11px var(--font-data); padding: 2px 6px; border-radius: 3px;
  }

  /* Round Navigation */
  .rounds-bar {
    display: flex; gap: 6px; margin: 16px 0 12px; overflow-x: auto;
    padding-bottom: 6px; scrollbar-width: none;
  }
  .rounds-bar::-webkit-scrollbar { display: none; }
  .round-btn {
    font-family: var(--font-data); font-size: 13px; font-weight: 500;
    background: rgba(245, 240, 230, 0.04); border: 1px solid var(--line); color: var(--sand);
    padding: 8px 14px; white-space: nowrap; border-radius: 4px; transition: all 0.2s;
  }
  .round-btn:hover { border-color: var(--amber); color: var(--ivory); }
  .round-btn[aria-pressed="true"] {
    background: var(--ivory); color: var(--walnut); border-color: var(--ivory); font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Search Input */
  .search-section { margin: 12px 0 20px; }
  .search-label { font-size: 12.5px; color: var(--sand); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .search-row { display: flex; align-items: center; background: var(--baize-deep); border: 1px solid var(--line); border-radius: 6px; transition: border-color 0.2s; }
  .search-row:focus-within { border-color: var(--amber); box-shadow: 0 0 10px rgba(230, 179, 60, 0.15); }
  .search-row input {
    flex: 1; background: transparent; border: 0; color: var(--ivory);
    font: 16px/1.4 var(--font-body); padding: 13px 14px; min-width: 0;
  }
  .search-row input::placeholder { color: rgba(199, 190, 171, 0.5); font-size: 14.5px; }
  .search-row input:focus { outline: none; }
  .btn-clear { background: transparent; border: 0; color: var(--sand); padding: 0 14px; font-size: 20px; display: none; }
  .btn-clear.show { display: block; }

  /* Table-Tent Card */
  .cards-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 22px; }
  .tent {
    background: var(--ivory); color: var(--walnut);
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s ease;
  }
  .tent .rail {
    height: 12px;
    background: repeating-conic-gradient(var(--walnut) 0% 25%, var(--ivory) 0% 50%) 0 0 / 24px 24px;
  }
  .tent-body { display: flex; align-items: stretch; }
  .board-no {
    background: var(--amber);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-width: 110px; padding: 16px 10px;
    border-right: 2.5px solid var(--walnut);
  }
  .board-no .lbl { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--walnut); font-weight: 600; }
  .board-no .num { font-family: var(--font-display); font-size: 60px; line-height: 1; color: var(--walnut); margin-top: 2px; }

  .tent-info { flex: 1; padding: 14px 16px 14px; min-width: 0; }
  .you-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .you-name { font-weight: 700; font-size: 17.5px; color: var(--walnut-2); line-height: 1.25; }
  .color-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; font-weight: 600;
    padding: 3px 9px; border-radius: 3px; border: 1.5px solid var(--walnut);
  }
  .color-chip.white { background: #ffffff; color: var(--walnut); }
  .color-chip.black { background: var(--walnut); color: var(--ivory); }
  .color-chip .pc { font-size: 15px; line-height: 1; }

  .vs-box {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(30, 21, 9, 0.25);
    font-size: 14px; color: #4a3c26;
  }
  .vs-box .opp-name { font-weight: 700; color: var(--walnut); font-size: 15.5px; }

  .meta-pills {
    display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap;
    font-family: var(--font-data); font-size: 11.5px; color: #69593c;
  }
  .result-pill {
    font-family: var(--font-data); font-size: 11.5px; font-weight: 600;
    background: var(--walnut); color: var(--ivory); padding: 2px 8px; border-radius: 3px;
  }

  /* Status message */
  .state-msg { color: var(--sand); font-size: 13.5px; padding: 4px 2px 14px; }
  .state-msg strong { color: var(--ivory); }

  /* Pairing List Table */
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 12px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .list-head h2 { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sand); font-weight: 500; }
  .count-tag { font-family: var(--font-data); font-size: 12px; color: var(--amber); }

  .pairing-list { list-style: none; }
  .pairing-list li { border-bottom: 1px solid var(--line); }
  .pair-btn {
    width: 100%; display: grid; grid-template-columns: 42px 1fr auto 1fr; gap: 8px; align-items: center;
    background: transparent; border: 0; color: var(--ivory); text-align: left;
    padding: 10px 4px; font-size: 13.5px; transition: background 0.15s;
  }
  .pair-btn:hover { background: rgba(245, 240, 230, 0.05); }
  .pair-btn .b { font-family: var(--font-display); font-size: 18px; color: var(--amber); text-align: center; }
  .pair-btn .p { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pair-btn .p small { display: block; font-family: var(--font-data); font-size: 11px; color: var(--sand); }
  .pair-btn .p.right { text-align: right; }
  .pair-btn .r { font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--amber-light); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 3px; }
  mark { background: var(--amber); color: var(--baize-deep); padding: 0 2px; border-radius: 2px; font-weight: 600; }

  footer {
    margin-top: 40px; text-align: center;
    font-family: var(--font-data); font-size: 11px; color: rgba(199, 190, 171, 0.5); letter-spacing: 0.08em;
  }

  @media (max-width: 420px) {
    .board-no { min-width: 90px; }
    .board-no .num { font-size: 48px; }
    .pair-btn { grid-template-columns: 34px 1fr auto 1fr; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-row">
      <div class="brand"><span class="dot"></span> Pairing Board</div>
      <div class="live-status active" id="liveStatus">
        <span class="pulse-dot"></span> <span id="statusTxt">Ready</span>
      </div>
    </div>
    <h1>Find your <em>table</em><br>in seconds.</h1>

    <!-- Tournament URL / ID Bar -->
    <div class="tnr-box">
      <div class="tnr-row">
        <div class="tnr-input-wrap">
          <input id="tnrInput" placeholder="Paste chess-results link or enter ID (e.g. 1434355)" autocomplete="off">
        </div>
        <button class="btn-load" id="btnLoad">Load</button>
      </div>
      <div class="tnr-hints">
        <span id="eventSub">Live chess-results.com scraper</span>
        <label>Auto-refresh:
          <select class="auto-refresh-select" id="autoRefreshSel">
            <option value="0">Off</option>
            <option value="15">15s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
        </label>
      </div>
    </div>

    <div class="event-meta">
      <strong id="eventName">Loading tournament data…</strong>
      <span class="meta-tag" id="metaInfo">Rounds: —</span>
    </div>
  </header>

  <!-- Round Tabs -->
  <nav class="rounds-bar" id="roundsBar" aria-label="Rounds"></nav>

  <!-- Flexible Search Input -->
  <div class="search-section">
    <div class="search-label">
      <span>Search player (any name order, start #, FIDE ID, board #)</span>
      <span id="searchStatus"></span>
    </div>
    <div class="search-row">
      <input id="q" type="search" placeholder="e.g. John Doe, Doe John, 14, or Board 5..." autocomplete="off">
      <button class="btn-clear" id="btnClear" aria-label="Clear search">×</button>
    </div>
  </div>

  <!-- Cards View -->
  <section class="cards-container" id="cardsContainer" aria-live="polite"></section>
  <p class="state-msg" id="stateMsg"></p>

  <!-- Pairing List View -->
  <div class="list-head">
    <h2 id="listTitle">Pairings</h2>
    <span class="count-tag" id="countTag">0 boards</span>
  </div>
  <ul class="pairing-list" id="pairingList"></ul>

  <footer>STANDALONE & CLOUD-READY · CHESS-RESULTS PAIRING VIEWER</footer>
</div>

<script src="script.js"></script>
<script>
/* ------------------------------------------------------------------ */
/* State & Helpers                                                    */
/* ------------------------------------------------------------------ */
let state = {
  tnr: "",      // Default active tournament ID
  round: 1,
  roundsAvailable: [1],
  meta: null,
  roundData: null,
  pinnedBoard: null,
  autoRefreshInterval: 30,
  timerId: null,
  isLoading: false,
  useClientScraper: false
};

const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function extractTnrId(inputStr) {
  if (!inputStr) return "1434355";
  const cleaned = decodeURIComponent(inputStr.trim());
  const m = cleaned.match(/tnr(\d+)/i);
  if (m) return m[1];
  const d = cleaned.match(/\d+/);
  return d ? d[0] : "1434355";
}

/* ------------------------------------------------------------------ */
/* Order-Agnostic Token Search                                         */
/* ------------------------------------------------------------------ */
function normTokens(str) {
  if (!str) return [];
  return str.normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/,/g, " ")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/)
    .filter(Boolean);
}

function matchPairing(p, q) {
  if (!q || !q.trim()) return [];
  const rawQ = q.trim();
  const qTokens = normTokens(rawQ);
  const isNum = /^\d+$/.test(rawQ);
  const qNum = isNum ? parseInt(rawQ, 10) : null;

  const matches = [];
  const boardHit = isNum && p.board === qNum;

  for (const [color, me, opp] of [["white", p.white, p.black], ["black", p.black, p.white]]) {
    if (!me || !me.name) continue;

    const idHit = isNum && (me.start_no === qNum || me.fide_id === rawQ);
    const nameTokens = normTokens(me.name);

    let nameHit = false;
    if (qTokens.length > 0) {
      nameHit = qTokens.every(qTok => nameTokens.some(nTok => nTok.includes(qTok)));
    }

    if (boardHit || idHit || nameHit) {
      matches.push({ board: p.board, color, me, opp, result: p.result });
    }
  }
  return matches;
}

function findMatches(q) {
  if (!state.roundData || !state.roundData.pairings) return [];
  let results = [];
  for (const p of state.roundData.pairings) {
    const hits = matchPairing(p, q);
    results.push(...hits);
  }
  return results;
}

/* ------------------------------------------------------------------ */
/* Rendering Functions                                                */
/* ------------------------------------------------------------------ */
function fmtPts(p) {
  if (p == null) return "";
  return (p % 1 === 0.5) ? (Math.floor(p) || "0") + "½" : p;
}

function tentCardHTML(m) {
  const pc = m.color === "white" ? "♔" : "♚";
  const colorTxt = m.color === "white" ? "White" : "Black";
  return `
  <article class="tent" aria-label="Board ${m.board}">
    <div class="rail" aria-hidden="true"></div>
    <div class="tent-body">
      <div class="board-no">
        <span class="lbl">Board</span>
        <span class="num">${m.board}</span>
      </div>
      <div class="tent-info">
        <div class="you-row">
          <span class="you-name">${esc(m.me.name)}</span>
          <span class="color-chip ${m.color}"><span class="pc">${pc}</span> ${colorTxt}</span>
        </div>
        <div class="vs-box">
          vs <span class="opp-name">${esc(m.opp.name)}</span>
          ${m.opp.rating ? `· ${m.opp.rating}` : ""}
        </div>
        <div class="meta-pills">
          ${m.me.start_no ? `<span>Start #${m.me.start_no}</span>` : ""}
          ${m.me.rating ? `<span>Rating ${m.me.rating}</span>` : ""}
          ${m.me.points != null ? `<span>You: ${fmtPts(m.me.points)} pts</span>` : ""}
          ${m.opp.points != null ? `<span>Opp: ${fmtPts(m.opp.points)} pts</span>` : ""}
          ${m.result ? `<span class="result-pill">${esc(m.result)}</span>` : ""}
        </div>
      </div>
    </div>
  </article>`;
}

function hilite(name, q) {
  if (!q || !q.trim()) return esc(name);
  const qToks = normTokens(q);
  let safeName = esc(name);
  for (const tok of qToks) {
    if (tok.length < 2) continue;
    const re = new RegExp(`(${tok})`, "gi");
    safeName = safeName.replace(re, "<mark>$1</mark>");
  }
  return safeName;
}

function renderUI() {
  const q = $("q").value.trim();

  // Header metadata
  if (state.meta) {
    $("eventName").textContent = state.meta.tournament_name || `Tournament ${state.tnr}`;
    $("metaInfo").textContent = `Rounds: ${state.roundsAvailable.length} · Players: ${state.meta.total_players || '—'}`;
  } else if (state.roundData) {
    $("eventName").textContent = state.roundData.tournament_name;
  }

  $("btnClear").classList.toggle("show", !!q);

  // Render Round Tabs (all available rounds)
  const totalRds = Math.max(state.roundsAvailable.length, state.round);
  $("roundsBar").innerHTML = Array.from({ length: totalRds }, (_, i) => i + 1)
    .map(n => `<button class="round-btn" aria-pressed="${n === state.round}" data-rd="${n}">Round ${n}</button>`)
    .join("");

  // Cards view
  let found = [];
  if (q.length >= 1) {
    found = findMatches(q);
  } else if (state.pinnedBoard != null && state.roundData) {
    const p = state.roundData.pairings.find(x => x.board === state.pinnedBoard);
    if (p) {
      found = [{ board: p.board, color: "white", me: p.white, opp: p.black, result: p.result }];
    }
  }

  $("cardsContainer").innerHTML = found.slice(0, 4).map(tentCardHTML).join("");
  $("stateMsg").innerHTML =
    q.length >= 1 && !found.length
      ? `No player matching <strong>"${esc(q)}"</strong> in Round ${state.round}. Check spelling or try your start number / board number.`
      : !q && !found.length
      ? `Type your name or board number above to highlight your card.`
      : "";

  // Pairings List
  if (state.roundData && state.roundData.pairings) {
    $("listTitle").textContent = `Round ${state.round} Pairings`;
    $("countTag").textContent = `${state.roundData.total_boards || state.roundData.pairings.length} boards`;
    $("pairingList").innerHTML = state.roundData.pairings.map(p => `
      <li>
        <button class="pair-btn" data-board="${p.board}">
          <span class="b">${p.board}</span>
          <span class="p">${hilite(p.white.name, q)}<small>${p.white.rating ?? "unr."} · ${fmtPts(p.white.points) ?? ""}</small></span>
          <span class="r">${p.result ? esc(p.result) : "vs"}</span>
          <span class="p right">${hilite(p.black.name, q)}<small>${p.black.rating ?? "unr."} · ${fmtPts(p.black.points) ?? ""}</small></span>
        </button>
      </li>`).join("");
  } else {
    $("pairingList").innerHTML = "";
    $("countTag").textContent = "0 boards";
  }
}

/* ------------------------------------------------------------------ */
/* Network layer lives in script.js (Cloudflare Worker backed).        */
/* It defines: fetchRawChessResults, parseHTMLPairings,                */
/* loadTournament, loadRound.                                          */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Auto Refresh Timer                                                 */
/* ------------------------------------------------------------------ */
function resetTimer() {
  if (state.timerId) clearInterval(state.timerId);
  if (state.autoRefreshInterval > 0) {
    state.timerId = setInterval(() => {
      if (state.tnr && !state.isLoading) {
        loadRound(state.tnr, state.round, true);
      }
    }, state.autoRefreshInterval * 1000);
  }
}

/* ------------------------------------------------------------------ */
/* Event Handlers                                                     */
/* ------------------------------------------------------------------ */
$("btnLoad").addEventListener("click", () => {
  const val = $("tnrInput").value.trim();
  if (val) loadTournament(val, 1);
});

$("tnrInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const val = $("tnrInput").value.trim();
    if (val) loadTournament(val, 1);
  }
});

$("q").addEventListener("input", () => {
  state.pinnedBoard = null;
  renderUI();
});

$("btnClear").addEventListener("click", () => {
  $("q").value = "";
  state.pinnedBoard = null;
  renderUI();
  $("q").focus();
});

$("roundsBar").addEventListener("click", e => {
  const btn = e.target.closest("[data-rd]");
  if (btn) {
    const rd = parseInt(btn.dataset.rd, 10);
    state.pinnedBoard = null;
    loadRound(state.tnr, rd);
  }
});

$("pairingList").addEventListener("click", e => {
  const btn = e.target.closest("[data-board]");
  if (!btn) return;
  state.pinnedBoard = parseInt(btn.dataset.board, 10);
  $("q").value = "";
  renderUI();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("autoRefreshSel").addEventListener("change", e => {
  state.autoRefreshInterval = parseInt(e.target.value, 10);
  resetTimer();
});

/* ------------------------------------------------------------------ */
/* Initialization                                                     */
/* ------------------------------------------------------------------ */
window.addEventListener("DOMContentLoaded", () => {
  let initialTnr = state.tnr;
  if (window.location.hash.length > 1) {
    initialTnr = extractTnrId(window.location.hash.substring(1));
  } else {
    const params = new URLSearchParams(window.location.search);
    if (params.get("tnr")) initialTnr = extractTnrId(params.get("tnr"));
  }

  loadTournament(initialTnr, 1);
  resetTimer();
});
</script>
</body>
</html>
